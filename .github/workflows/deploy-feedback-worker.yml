name: Deploy feedback Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment: feedback-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/feedback-worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm --dir services/feedback-worker install --frozen-lockfile --ignore-workspace

      - name: Test Worker
        run: pnpm --dir services/feedback-worker test

      - name: Typecheck Worker
        run: pnpm --dir services/feedback-worker typecheck

      - name: Deploy production Worker
        run: pnpm --dir services/feedback-worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
